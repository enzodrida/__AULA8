<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Base 3 — Tabelas e Formulários</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- INSTRUÇÕES (resumo):
    Objetivo: praticar seletores de tabela, pseudo-classes estruturais e seletor de atributo.
    Edite APENAS o style.css.
    Tarefas:
      1) Listras na tabela (linhas pares/ímpares) usando :nth-child.
      2) Destacar cabeçalho da tabela (thead).
      3) Estilizar inputs obrigatórios [required] e inválidos :invalid.
      4) Formatar o botão de envio e seu :hover.
      5) Opcional: destacar a célula sobre a qual o mouse passa (use :hover no <tr>).
  -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Relatório de Itens</h1>
    <table class="tabela">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Status</th>
          <th>Categoria</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>1</td><td>Item Alpha</td><td>Ativo</td><td>A</td></tr>
        <tr><td>2</td><td>Item Beta</td><td>Inativo</td><td>B</td></tr>
        <tr><td>3</td><td>Item Gama</td><td>Ativo</td><td>A</td></tr>
        <tr><td>4</td><td>Item Delta</td><td>Ativo</td><td>C</td></tr>
      </tbody>
    </table>

    <h2>Formulário de Cadastro</h2>
    <form class="cadastro">
      <label>Nome* <input type="text" name="nome" required placeholder="Seu nome completo"></label>
      <label>Email* <input type="email" name="email" required placeholder="voce@exemplo.com"></label>
      <label>Categoria
        <select name="categoria">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>
      </label>
      <button type="submit" class="btn">Salvar</button>
    </form>
  </main>
  <footer>
    <small>Base 3 — 1º semestre • Turmas grandes (5–7 por grupo)</small>
  </footer>
</body>
</html>
